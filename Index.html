
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">

  <title>Lankhulo AI by Adam Gomani</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./app-icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    header {
      background: linear-gradient(135deg,#172554,#2563eb,#7c3aed);
      color: white;
      text-align: center;
      padding: 28px 12px;
      border-bottom: 4px solid #38bdf8;
    }

    header img {
      width: 65px;
      height: 65px;
      border-radius: 16px;
    }

    header h1 {
      margin: 10px 0 5px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      color: #e0e7ff;
      font-weight: bold;
    }

    main {
      max-width: 750px;
      margin: auto;
      padding: 15px;
    }

    .welcome {
      text-align: center;
      padding: 12px;
    }

    .chat {
      background: white;
      border-radius: 15px;
      padding: 15px;
      height: 52vh;
      min-height: 330px;
      overflow-y: auto;
      box-shadow: 0 4px 15px #00000010;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #dbeafe;
      margin-left: 15%;
    }

    .ai {
      background: #f1f5f9;
      margin-right: 15%;
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    textarea {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      resize: none;
      font-family: Arial, sans-serif;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    .new-chat {
      width: 100%;
      margin-top: 10px;
      background: #475569;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 22px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <img src="./app-icon-192.png" alt="Lankhulo AI logo">
  <h1>Lankhulo AI</h1>
  <p>by Adam Gomani</p>
  <small>Intelligent Conversations. Endless Possibilities.</small>
</header>

<main>
  <div class="welcome">
    <h3>Your Intelligent AI Assistant</h3>
    <p>Ask questions in English or Chichewa.</p>
  </div>

  <div class="chat" id="chat">
    <div class="message ai">
      <span class="label">Lankhulo AI</span>
      Hello! Welcome to Lankhulo AI, created by Adam Gomani.
      How can I help you?
    </div>
  </div>

  <div class="input-area">
    <textarea id="question" rows="2"
      placeholder="Message Lankhulo AI..."></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>

  <button class="new-chat" onclick="newChat()">+ New Chat</button>
</main>

<footer>
  Lankhulo AI © 2026<br>
  Developed by Adam Gomani
</footer>

<script>
  const AI_URL =
    "https://script.google.com/macros/s/AKfycby8iRhYxii8puQdhErHnSoPMlM5RihAqdUnNuTfNJCfW3O4cx_ibzwyJsm_nLCWRQiq/exec";

  const chat = document.getElementById("chat");
  const input = document.getElementById("question");
  const send = document.getElementById("send");

  function addMessage(message, type) {
    const div = document.createElement("div");
    div.className = "message " + type;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = type === "user" ? "You" : "Lankhulo AI";

    const content = document.createElement("div");
    content.textContent = message;

    div.append(label, content);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  function sendMessage() {
    const question = input.value.trim();

    if (!question || send.disabled) return;

    addMessage(question, "user");
    input.value = "";

    const loading = addMessage("Thinking...", "ai");

    send.disabled = true;

    // The Apps Script URL is retained as the backend.
    // We use an iframe bridge because Apps Script responses
    // are not directly accessible from a different website.
    const frame = document.createElement("iframe");
    frame.style.display = "none";
    frame.src = AI_URL;

    document.body.appendChild(frame);

    loading.querySelector("div").textContent =
      "Please open your original Lankhulo AI service to continue. " +
      "The secure messaging connection needs a backend bridge.";

    send.disabled = false;
    frame.remove();
  }

  function newChat() {
    chat.innerHTML = "";
    addMessage(
      "Hello! Welcome to Lankhulo AI, created by Adam Gomani. How can I help you?",
      "ai"
    );
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.log("Service worker:", error));
  }
</script>

</body>
</html>
